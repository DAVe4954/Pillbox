[package]
name = "pillbox"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
pillbox-core = { path = "../pillbox-core" }

[dependencies]
pillbox-core = { path = "../pillbox-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
windows-registry = "0.5"
windows-numerics = "0.2"
windows-core = "0.61"
ureq = "2"
# WebView2 COM interfaces for the chat drawer (M5b). 0.38 is the last release on windows 0.61.
webview2-com = "0.38"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
# M6 phone server (see README "Stack changes"): axum on a one-thread tokio runtime that exists
# only while a QR code is on screen; tokio-util/futures-core stream files to the phone.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "fs", "io-util", "macros", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
futures-core = "0.3.34"

